name: unity-editor-tests

# Licensed Unity execution (M01-W0106 acceptance gate).
#
# Security model
#   - manual workflow_dispatch only; never push, never pull_request, so a
#     privileged Windows machine can never execute untrusted fork code;
#   - contents: read, no write token;
#   - two owner switches must be "true": TTG_UNITY_RUNNER_ENABLED (a licensed
#     runner exists) and TTG_UNITY_ENV_CONFIRMED (the `unity-licensed`
#     environment exists WITH protection rules). Referencing a non-existent
#     environment would auto-create an unprotected one, so the second switch is
#     what prevents a silent, unprotected run;
#   - tooling/cmd/unitygate enforces: ref == refs/heads/main, repository identity,
#     full 40-hex SHA, requested == checked out == freshly fetched origin/main
#     tip (exact equality; a stale ancestor is rejected);
#   - every job checks out the approved SHA and re-checks its own HEAD;
#   - raw editor output never reaches the workflow log: the wrappers capture it to
#     a protected temporary file and print only a sanitized extract;
#   - evidence is published by tooling/publish-unity-evidence.ps1, which empties
#     the artifact directory first, refuses credential-class findings in logs,
#     scans NUnit XML without rewriting it, and publishes only after validation;
#   - upload steps run only when that publish step succeeded, so a sanitizer
#     failure results in zero uploaded artifacts;
#   - the acceptance job re-parses the XML, re-checks the executed counts and
#     requires every artifact to report the approved revision and repository.
#
# Infrastructure this needs and that this repository does NOT provide today
#   (verified 2026-11-04: environments API total_count = 0, workflow runs = 0):
#   1. an isolated Windows runner labelled [self-hosted, Windows, X64, ttgqldl-unity]
#   2. Unity 6000.6.7f1 + Windows Standalone module on that runner
#   3. a Unity licence activated on that runner (held in the protected environment)
# Registering a runner and holding a licence are repository-owner actions.

on:
  workflow_dispatch:
    inputs:
      confirm_main_sha:
        description: 'Full 40-character SHA of the current main HEAD to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unity-editor-tests
  cancel-in-progress: false

env:
  UNITY_VERSION: '6000.6.7f1'
  EXPECTED_REPOSITORY: 'hung98dev/ttgqldl'

jobs:
  preflight:
    name: preflight (exact main HEAD, owner switches)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false

      - name: gate
        id: gate
        env:
          RUNNER_ENABLED: ${{ vars.TTG_UNITY_RUNNER_ENABLED }}
          ENV_CONFIRMED: ${{ vars.TTG_UNITY_ENV_CONFIRMED }}
          REQUESTED_SHA: ${{ inputs.confirm_main_sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "checked-out: ${checked}"
          echo "origin/main: ${remote_main}"
          if ! ( cd tooling && go run ./cmd/unitygate \
              -runner-enabled "${RUNNER_ENABLED}" \
              -environment-ready "${ENV_CONFIRMED}" \
              -ref "${GITHUB_REF}" \
              -repository "${GITHUB_REPOSITORY}" \
              -expected-repository "${EXPECTED_REPOSITORY}" \
              -requested-sha "${REQUESTED_SHA}" \
              -checkout-sha "${checked}" \
              -remote-main-sha "${remote_main}" \
              -json ) | tee gate.json; then
            echo "::error::preflight gate rejected this run; see the reasons above"
            exit 1
          fi
          sha="$(python3 -c 'import json;print(json.load(open("gate.json"))["sha"])')"
          if [[ -z "${sha}" ]]; then
            echo "::error::gate did not return an accepted SHA"
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: upload gate decision
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-preflight
          path: gate.json
          if-no-files-found: warn
          retention-days: 14

  editmode:
    name: edit mode (licensed editor)
    needs: preflight
    runs-on: [self-hosted, Windows, X64, ttgqldl-unity]
    environment: unity-licensed
    timeout-minutes: 45
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          clean: true
          fetch-depth: 1

      - name: verify revision and repository
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          $remote = (git config --get remote.origin.url)
          if ($sha -ne $env:EXPECTED_SHA) { throw "checkout mismatch: $sha != $env:EXPECTED_SHA" }
          if ($env:GITHUB_REPOSITORY -ne 'hung98dev/ttgqldl') { throw "unexpected repository $env:GITHUB_REPOSITORY" }
          if ($remote -notmatch 'hung98dev/ttgqldl') { throw "unexpected remote $remote" }
          Write-Host "revision $sha verified"

      - name: run EditMode suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tooling/unity-test.ps1 -Platform EditMode

      - name: publish sanitized evidence
        id: publish
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xml = 'unity/TestResults/editmode.xml'
          $log = 'unity/TestResults/editmode.log'
          $args = @{
            ArtifactDirectory = 'artifacts/evidence'
            Revision          = '${{ needs.preflight.outputs.sha }}'
            Kind              = 'editmode'
            Ref               = '${{ github.ref }}'
          }
          if (Test-Path $xml) { $args.XmlPath = $xml }
          if (Test-Path $log) { $args.LogPath = $log }
          ./tooling/publish-unity-evidence.ps1 @args

      - name: upload edit mode evidence
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-editmode-results
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 14

  playmode:
    name: play mode (licensed editor)
    needs: preflight
    runs-on: [self-hosted, Windows, X64, ttgqldl-unity]
    environment: unity-licensed
    timeout-minutes: 45
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          clean: true
          fetch-depth: 1

      - name: verify revision and repository
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'checkout mismatch' }
          if ($env:GITHUB_REPOSITORY -ne 'hung98dev/ttgqldl') { throw 'unexpected repository' }

      - name: run PlayMode suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tooling/unity-test.ps1 -Platform PlayMode

      - name: publish sanitized evidence
        id: publish
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xml = 'unity/TestResults/playmode.xml'
          $log = 'unity/TestResults/playmode.log'
          $args = @{
            ArtifactDirectory = 'artifacts/evidence'
            Revision          = '${{ needs.preflight.outputs.sha }}'
            Kind              = 'playmode'
            Ref               = '${{ github.ref }}'
          }
          if (Test-Path $xml) { $args.XmlPath = $xml }
          if (Test-Path $log) { $args.LogPath = $log }
          ./tooling/publish-unity-evidence.ps1 @args

      - name: upload play mode evidence
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-playmode-results
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 14

  player-build:
    name: windows player build (licensed editor)
    needs: preflight
    runs-on: [self-hosted, Windows, X64, ttgqldl-unity]
    environment: unity-licensed
    timeout-minutes: 60
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          clean: true
          fetch-depth: 1

      - name: build Windows x64 player
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:EXPECTED_SHA) { throw "checkout mismatch: $sha != $env:EXPECTED_SHA" }
          ./tooling/unity-build.ps1
          $player = 'unity/Build/Windows/TTGQLDL.exe'
          if (-not (Test-Path $player)) { throw "player missing: $player" }
          $summary = [ordered]@{
            revision    = $sha
            unity       = '6000.6.7f1'
            target      = 'StandaloneWindows64'
            player      = 'TTGQLDL.exe'
            playerBytes = (Get-Item $player).Length
            builtAtUtc  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            runnerOs    = $env:RUNNER_OS
            runnerArch  = $env:RUNNER_ARCH
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $summary | ConvertTo-Json | Set-Content artifacts/build-summary.json
          Write-Host ($summary | ConvertTo-Json -Compress)

      - name: publish sanitized evidence
        id: publish
        if: always()
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $buildSummary = 'artifacts/build-summary.json'
          if (-not (Test-Path $buildSummary)) {
            throw 'build summary missing; refusing to publish a partial bundle'
          }
          $log = 'unity/TestResults/build.log'
          $args = @{
            ArtifactDirectory = 'artifacts/evidence'
            Revision          = $env:EXPECTED_SHA
            Kind              = 'build'
            Ref               = '${{ github.ref }}'
          }
          if (Test-Path $log) { $args.LogPath = $log }
          ./tooling/publish-unity-evidence.ps1 @args
          Copy-Item $buildSummary (Join-Path 'artifacts/evidence' 'build-summary.json') -Force

      - name: upload build evidence
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-build-summary
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: acceptance (independent evidence check)
    needs: [preflight, editmode, playmode, player-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          clean: true
          fetch-depth: 1

      - name: verify revision and repository
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:EXPECTED_SHA) { throw "checkout mismatch: $sha != $env:EXPECTED_SHA" }
          if ($env:GITHUB_REPOSITORY -ne 'hung98dev/ttgqldl') { throw 'unexpected repository' }
          Write-Host "acceptance revision $sha verified"

      - name: download evidence
        uses: actions/download-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          path: artifacts

      - name: validate evidence bundle
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tooling/unity-acceptance-check.ps1 `
            -ArtifactsRoot artifacts `
            -ExpectedRevision $env:EXPECTED_SHA `
            -ExpectedRepository 'hung98dev/ttgqldl' `
            -OutFile 'artifacts/acceptance/acceptance.json'

      - name: upload acceptance report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-acceptance-report
          path: artifacts/acceptance/acceptance.json
          if-no-files-found: error
          retention-days: 30
