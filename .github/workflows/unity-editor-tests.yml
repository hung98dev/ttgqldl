name: unity-editor-tests

# Licensed Unity execution (M01-W0106 acceptance gate).
#
# This workflow is intentionally manual and fails closed:
#   - it never runs on push or pull_request, so a privileged Windows machine can
#     never execute untrusted code from a fork;
#   - it refuses to start until the repository owner sets the repository variable
#     TTG_UNITY_RUNNER_ENABLED=true (a deliberate, auditable switch);
#   - the requested SHA must be the current main HEAD, verified against
#     origin/main, so only a reviewed main revision can be accepted;
#   - it uses the same wrapper developers run locally (tooling/unity-test.ps1),
#     never a looser invocation;
#   - it records the real SHA, editor version and test counts, and uploads only
#     sanitized XML/logs/summaries (no licence files, tokens or machine ids).
#
# Infrastructure this needs and that this repository does NOT provide:
#   1. an isolated Windows runner labelled [self-hosted, Windows, X64, ttgqldl-unity]
#   2. Unity 6000.6.7f1 with the Windows standalone module installed there
#   3. a Unity licence activated on that runner through the protected environment
#      `unity-licensed` (secrets held in GitHub, never in the repository)
# Registering a runner and holding the licence are repository-owner actions.

on:
  workflow_dispatch:
    inputs:
      confirm_main_sha:
        description: 'Full 40-character SHA of the current main HEAD to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unity-editor-tests
  cancel-in-progress: false

env:
  UNITY_VERSION: '6000.6.7f1'
  # Pinned so the accepted revision is unambiguous.
  CHECKOUT_SHA: 3d3c42e5aac5ba805825da76410c181273ba90b1
  UPLOAD_ARTIFACT_SHA: b7c566a772e6b6bfb58ed0dc250532a479d7789f

jobs:
  preflight:
    name: preflight (main-only, runner enabled)
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: gate
        id: gate
        env:
          RUNNER_ENABLED: ${{ vars.TTG_UNITY_RUNNER_ENABLED }}
          REQUESTED_SHA: ${{ inputs.confirm_main_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "checked-out ${sha}"

          if [[ "${RUNNER_ENABLED}" != "true" ]]; then
            echo "::error::TTG_UNITY_RUNNER_ENABLED is not 'true'. No licensed Unity runner is configured for this repository, so W0106 cannot be accepted. See docs/evidence/M01-W0106.md section 2 for the exact infrastructure that must be provisioned."
            exit 1
          fi

          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::confirm_main_sha must be a full 40-character commit SHA"
            exit 1
          fi

          git fetch --quiet origin main
          if [[ "${REQUESTED_SHA}" != "${sha}" ]]; then
            echo "::error::requested ${REQUESTED_SHA} is not the checked-out main HEAD ${sha}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "::error::${sha} is not on origin/main; only main revisions can be accepted"
            exit 1
          fi

          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "accepted revision ${sha}"

  editmode:
    name: edit mode (licensed editor)
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: [self-hosted, Windows, X64, ttgqldl-unity]
    environment: unity-licensed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          clean: true

      - name: verify editor and run EditMode suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "checked-out revision: $sha"
          if ($sha -ne '${{ needs.preflight.outputs.sha }}') {
            throw "checkout mismatch: $sha"
          }
          ./tooling/unity-test.ps1 -Platform EditMode

      - name: upload edit mode results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-editmode-results
          path: |
            unity/TestResults/editmode.xml
            unity/TestResults/editmode.log
          if-no-files-found: warn
          retention-days: 14

  playmode:
    name: play mode (licensed editor)
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: [self-hosted, Windows, X64, ttgqldl-unity]
    environment: unity-licensed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          clean: true

      - name: verify editor and run PlayMode suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne '${{ needs.preflight.outputs.sha }}') {
            throw "checkout mismatch: $sha"
          }
          ./tooling/unity-test.ps1 -Platform PlayMode

      - name: upload play mode results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-playmode-results
          path: |
            unity/TestResults/playmode.xml
            unity/TestResults/playmode.log
          if-no-files-found: warn
          retention-days: 14

  player-build:
    name: windows player build (licensed editor)
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: [self-hosted, Windows, X64, ttgqldl-unity]
    environment: unity-licensed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          clean: true

      - name: build Windows x64 player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tooling/unity-build.ps1
          $player = 'unity/Build/Windows/TTGQLDL.exe'
          if (-not (Test-Path $player)) { throw "player missing: $player" }
          $size = (Get-Item $player).Length
          $summary = [ordered]@{
            revision    = (git rev-parse HEAD).Trim()
            unity       = '6000.6.7f1'
            target      = 'StandaloneWindows64'
            player      = $player
            playerBytes = $size
            builtAtUtc  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            runnerOs    = $env:RUNNER_OS
            runnerArch  = $env:RUNNER_ARCH
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $summary | ConvertTo-Json | Set-Content artifacts/build-summary.json
          Write-Host ($summary | ConvertTo-Json -Compress)

      - name: upload build summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-build-summary
          path: |
            artifacts/build-summary.json
            unity/TestResults/build.log
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: acceptance report (executed counts)
    needs: [preflight, editmode, playmode, player-build]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: download results
        uses: actions/download-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          path: artifacts

      - name: build machine-readable acceptance report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tooling/unity-results.ps1
          $sha = '${{ needs.preflight.outputs.sha }}'
          $report = [ordered]@{
            revision   = $sha
            unity      = '6000.6.7f1'
            editmode   = $null
            playmode   = $null
            build      = $null
            acceptedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          foreach ($platform in @('editmode', 'playmode')) {
            $xml = Join-Path 'artifacts' "unity-$platform-results" "$platform.xml"
            if (-not (Test-Path $xml)) {
              throw "$platform result file is missing; refusing to report acceptance"
            }
            $summary = Get-UnityTestSummary -XmlPath $xml
            if ($summary.Problems.Count -gt 0) {
              throw "$platform result is not acceptable: $($summary.Problems -join '; ')"
            }
            if ($summary.Failed -gt 0) { throw "$platform has $($summary.Failed) failing tests" }
            $report[$platform] = [ordered]@{
              total = $summary.Total; passed = $summary.Passed; failed = $summary.Failed
              skipped = $summary.Skipped; executed = $summary.Executed
            }
          }
          if ($report.editmode.executed -lt 56) { throw "EditMode executed $($report.editmode.executed) < 56 baseline" }
          if ($report.playmode.executed -lt 7) { throw "PlayMode executed $($report.playmode.executed) < 7 baseline" }
          $buildJson = Join-Path 'artifacts' 'unity-build-summary' 'build-summary.json'
          if (-not (Test-Path $buildJson)) { throw 'build summary is missing' }
          $report.build = Get-Content $buildJson -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path artifacts/acceptance | Out-Null
          $report | ConvertTo-Json -Depth 5 | Set-Content artifacts/acceptance/acceptance.json
          Write-Host ($report | ConvertTo-Json -Depth 5)

      - name: upload acceptance report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-acceptance-report
          path: artifacts/acceptance/acceptance.json
          if-no-files-found: error
          retention-days: 30
