name: ci

# M01 database and backend CI.
#
# Covered here:
#   - PostgreSQL 18.6 started from the same pinned image and the same
#     docker/postgres/initdb role bootstrap the developer uses, so the
#     least-privilege model is exercised for real
#   - migrations as ttg_owner, runtime tests as ttg_app, DDL denial as ttg_app
#   - schema fingerprint drift, sqlc generated-code drift, migration
#     up/down/reapply and the destructive upgrade lifecycle on a disposable DB
#   - backend gofmt/vet/unit/race/linux build, M00 plan validator and golden
#     vectors, shell entry-point syntax
#
# Explicitly NOT covered yet: Unity (M06), the TypeScript operator (W0105),
# SAST/SBOM/secret/licence scanning and load/soak gates (M08).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  TTG_DB_NAME: ttgqldl_ci
  TTG_DB_PORT: "5432"
  # Pinned by tag and immutable digest; identical to compose.dev.yaml.
  POSTGRES_IMAGE: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
  SQLC_VERSION: v1.31.1

jobs:
  backend:
    name: backend (unit, race, postgres, migrations)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        # v7.0.1 - verified tag SHA; pinning the immutable commit avoids tag-move supply-chain risk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # v7.0.0 - verified tag SHA (node24 runtime, no Node 20 deprecation)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Generate ephemeral database credentials
        working-directory: .
        run: |
          set -euo pipefail
          admin="$(openssl rand -hex 16)"
          owner="$(openssl rand -hex 16)"
          app="$(openssl rand -hex 16)"
          # Mask before anything can print them.
          echo "::add-mask::${admin}"
          echo "::add-mask::${owner}"
          echo "::add-mask::${app}"
          {
            echo "TTG_DB_ADMIN_PASSWORD=${admin}"
            echo "TTG_OWNER_PASSWORD=${owner}"
            echo "TTG_APP_PASSWORD=${app}"
          } >> "${GITHUB_ENV}"

      - name: Start PostgreSQL 18.6 with the development role bootstrap
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name ttg-pg \
            -e POSTGRES_DB="${TTG_DB_NAME}" \
            -e POSTGRES_USER=ttg_bootstrap \
            -e POSTGRES_PASSWORD="${TTG_DB_ADMIN_PASSWORD}" \
            -e TTG_OWNER_PASSWORD="${TTG_OWNER_PASSWORD}" \
            -e TTG_APP_PASSWORD="${TTG_APP_PASSWORD}" \
            -p "127.0.0.1:${TTG_DB_PORT}:5432" \
            -v "${PWD}/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
            --health-cmd "pg_isready -U ttg_bootstrap -d ${TTG_DB_NAME} -h 127.0.0.1" \
            --health-interval 5s --health-timeout 3s --health-retries 20 --health-start-period 15s \
            "${POSTGRES_IMAGE}" >/dev/null
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ttg-pg)"
            if [ "${status}" = "healthy" ]; then
              echo "postgres is healthy"
              docker exec ttg-pg psql -U ttg_bootstrap -d "${TTG_DB_NAME}" -tAc "select version()"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become healthy" >&2
          docker logs ttg-pg >&2
          exit 1

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -count=1 ./...

      - name: race tests
        run: go test -race -count=1 ./...

      - name: migrations up as ttg_owner
        run: |
          set -euo pipefail
          export TTG_MIGRATION_DATABASE_URL="postgres://ttg_owner:${TTG_OWNER_PASSWORD}@127.0.0.1:${TTG_DB_PORT}/${TTG_DB_NAME}?sslmode=disable"
          go run ./cmd/migrate -direction up
          go run ./cmd/migrate -direction status

      - name: schema, permission and runtime tests as ttg_app
        run: |
          set -euo pipefail
          export TTG_TEST_DATABASE_URL="postgres://ttg_app:${TTG_APP_PASSWORD}@127.0.0.1:${TTG_DB_PORT}/${TTG_DB_NAME}?sslmode=disable"
          go test -count=1 -v ./test/integration/...

      - name: migration lifecycle on a disposable database
        run: |
          set -euo pipefail
          export TTG_TEST_DATABASE_URL="postgres://ttg_app:${TTG_APP_PASSWORD}@127.0.0.1:${TTG_DB_PORT}/${TTG_DB_NAME}?sslmode=disable"
          export TTG_MIGRATION_DATABASE_URL="postgres://ttg_owner:${TTG_OWNER_PASSWORD}@127.0.0.1:${TTG_DB_PORT}/${TTG_DB_NAME}?sslmode=disable"
          export TTG_TEST_DESTRUCTIVE=1
          go test -count=1 -v -run TestMigrationLifecycleDestructive ./test/integration/...

      - name: migrations roll back to zero and re-apply
        run: |
          set -euo pipefail
          export TTG_MIGRATION_DATABASE_URL="postgres://ttg_owner:${TTG_OWNER_PASSWORD}@127.0.0.1:${TTG_DB_PORT}/${TTG_DB_NAME}?sslmode=disable"
          go run ./cmd/migrate -direction down -to 0
          go run ./cmd/migrate -direction up
          go run ./cmd/migrate -direction status

      - name: sqlc generated-code drift
        run: |
          set -euo pipefail
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          # sqlc diff fails when internal/db does not match the committed schema
          # and queries; it never rewrites files.
          "$(go env GOPATH)/bin/sqlc" diff

      - name: linux build
        run: go build ./...

      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker rm -f ttg-pg || true

  frontend:
    name: operator (typecheck, lint, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Checkout
        # v7.0.1 - verified tag SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        # v6 - verified tag SHA (node24 runtime)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: operator/package-lock.json

      - name: install from lockfile
        run: npm ci --no-audit --no-fund

      - name: lockfile consistency
        run: |
          node -e '
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          const root = lock.packages[""] || {};
          const declared = { ...pkg.dependencies, ...pkg.devDependencies };
          const problems = [];
          if (lock.lockfileVersion < 3) problems.push(`lockfileVersion ${lock.lockfileVersion} is older than 3`);
          for (const [name, version] of Object.entries(declared)) {
            if (!/^\d+\.\d+\.\d+$/.test(version)) problems.push(`${name} is not pinned exactly (${version})`);
            const locked = root.dependencies?.[name] ?? root.devDependencies?.[name];
            if (locked !== version) problems.push(`${name} manifest=${version} lock=${locked}`);
          }
          if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
          console.log(`lockfile verified: ${Object.keys(declared).length} packages pinned exactly`);
          '

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: tests
        run: npm run test -- --run

      - name: production build
        run: npm run build

      # The production bundle must not carry privileged material. Demo mode is
      # never enabled in CI, and no secret is present in the environment.
      - name: bundle contains no credentials or database DSNs
        run: |
          set -euo pipefail
          if grep -RInE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|postgres://|ttg_app|ttg_owner' dist; then
            echo "privileged material found in the production bundle" >&2
            exit 1
          fi
          echo "bundle contains no credentials or DSNs"
          if [ "${VITE_OPERATOR_DEMO:-}" = "true" ]; then
            echo "VITE_OPERATOR_DEMO must not be enabled in CI" >&2
            exit 1
          fi
  unity:
    name: unity project (static, no editor)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tooling
    steps:
      - name: Checkout
        # v7.0.1 - verified tag SHA; pinning the immutable commit avoids tag-move supply-chain risk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # v7.0.0 - verified tag SHA (node24 runtime, no Node 20 deprecation)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # This job proves the Unity project is internally consistent: pinned
      # editor version, package lock, .meta coverage, scene guid integrity,
      # assembly boundaries and ignore rules. It is NOT a substitute for running
      # the editor: Unity EditMode/PlayMode execution and the Windows build stay
      # BLOCKED in CI because no licensed Unity runner is available and no
      # license secret may be stored in this repository. Run them locally with
      #   pwsh ./tooling/unity-test.ps1
      #   pwsh ./tooling/unity-build.ps1
      - name: unity project validation
        run: go run ./unitycheck -root ..

      - name: unity validator tests
        run: go test -count=1 ./unitycheck/...
  tooling:
    name: baseline tooling (plan validator, golden vectors)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tooling
    steps:
      - name: Checkout
        # v7.0.1 - verified tag SHA; pinning the immutable commit avoids tag-move supply-chain risk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # v7.0.0 - verified tag SHA (node24 runtime, no Node 20 deprecation)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          # tooling has no third-party dependencies, so there is no go.sum to cache
          cache: false

      - name: go vet
        run: go vet ./...

      - name: tooling tests
        run: go test -count=1 ./...

      - name: plan validator
        run: go run ./planvalidate -root ..

      - name: golden vectors
        run: go run ./refeval -check

      - name: unity result evaluation tests
        run: pwsh -NoProfile -File ./unity-results.test.ps1

      - name: shell script syntax
        working-directory: .
        run: |
          fail=0
          for script in tooling/*.sh docker/postgres/initdb/*.sh; do
            echo "bash -n ${script}"
            bash -n "${script}" || fail=1
          done
          exit "${fail}"
